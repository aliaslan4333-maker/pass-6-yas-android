name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk "$HOME" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadi"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          SDKROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build APK and unsigned AAB
        run: gradle :app:assembleDebug :app:bundleRelease --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: PASS-6-Yas-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: PASS-6-Yas-Release-AAB-Unsigned
          path: app/build/outputs/bundle/release/app-release.aab
