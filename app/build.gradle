plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def keyAliasEnv = System.getenv("ANDROID_KEY_ALIAS")
def keyPasswordEnv = System.getenv("ANDROID_KEY_PASSWORD")
def canSignRelease = keystorePath && keystorePassword && keyAliasEnv && keyPasswordEnv && file(keystorePath).exists()

android {
    namespace 'com.aliaslan.passdegerlendirme'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aliaslan.passdegerlendirme'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (canSignRelease) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
